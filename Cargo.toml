[package]
name = "codey"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "sync", "time", "io-util", "signal"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
regex = "1"
tokio-stream = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "sync", "time", "io-util"] }